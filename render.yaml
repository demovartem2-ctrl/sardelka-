services:
  - type: web
    name: nft-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_BASE
        value: https://misugram.cloud-ip.cc
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DAILY_LIMIT
        value: "50"
      - key: COOLDOWN_SEC
        value: "30"
      - key: USE_WEBHOOK
        value: "1"
